<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e5f86"/>
      <stop offset="0.5" stop-color="#4f86ad"/>
      <stop offset="1" stop-color="#5aa0b8"/>
    </linearGradient>
    <path id="northShape" d="M110,430 C80,330 100,200 170,130 C260,60 450,50 800,45 C1150,45 1380,60 1470,140 C1530,220 1530,420 1500,560 C1470,680 1420,770 1360,800 C1300,820 1230,780 1210,710 C1195,640 1220,560 1200,470 C1180,390 1150,320 1080,290 C1000,262 900,268 800,272 C680,272 600,265 560,290 C520,315 500,360 490,420 C480,470 450,500 400,490 C340,480 290,470 240,480 C180,490 130,480 110,430 Z"/>
    <path id="southShape" d="M250,660 C300,610 420,640 520,690 C620,740 720,770 820,760 C930,750 1040,720 1110,690 C1140,672 1170,668 1195,690 C1215,715 1195,760 1160,800 C1110,850 1090,920 1060,1000 L330,1000 C280,920 220,850 210,770 C205,720 215,690 250,660 Z"/>
    <clipPath id="northClip"><use href="#northShape"/></clipPath>
    <clipPath id="southClip"><use href="#southShape"/></clipPath>
    <style>
      .coast { fill: none; stroke: #2c3a40; stroke-width: 2.5; }
      .border { stroke: #ffffff; stroke-width: 1.5; stroke-dasharray: 5 4; stroke-opacity: 0.7; }
      .isle { stroke: #2c3a40; stroke-width: 1.5; }
      .n { font-size: 16px; font-weight: 700; fill: #1d2529; }
      .f { font-size: 11.5px; font-style: italic; fill: #33424a; }
      .p { font-size: 11px; fill: #2a353b; }
      .sea { font-size: 14px; font-weight: 700; letter-spacing: 3px; fill: #ffffff; opacity: 0.8; }
      .saints { fill: #c0392b; stroke: #ffffff; stroke-width: 1.5; }
      .poi { fill: #1d2529; stroke: #ffffff; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#sea)"/>
  <text x="800" y="24" text-anchor="middle" class="sea">NORTH · COLD</text>
  <text x="800" y="992" text-anchor="middle" class="sea">SOUTH · HOT</text>
  <text x="60" y="560" class="sea" font-size="12">OUTER OCEAN</text>
  <text x="1400" y="960" class="sea" font-size="12">OUTER OCEAN</text>

  <!-- NORTHERN CONTINENT -->
  <g clip-path="url(#northClip)">
    <polygon class="border" fill="#eef4f7" points="0,0 1600,0 1600,105 0,105"/>
    <polygon class="border" fill="#6f9b6a" points="0,105 420,105 430,300 330,330 0,330"/>
    <polygon class="border" fill="#a9c57f" points="0,330 330,330 430,300 520,330 520,520 0,520"/>
    <polygon class="border" fill="#5f8a6e" points="420,105 1180,105 1180,165 420,175"/>
    <polygon class="border" fill="#b3c98d" points="420,175 760,170 760,300 520,330 430,300"/>
    <polygon class="border" fill="#cfc98a" points="760,170 1180,165 1160,280 1000,300 760,300"/>
    <polygon class="border" fill="#9ebf7a" points="1180,105 1600,105 1600,560 1330,560 1330,280 1160,280 1180,165"/>
    <polygon class="border" fill="#c9b47a" points="1000,300 1160,280 1330,280 1330,560 1180,560"/>
    <polygon class="border" fill="#8cbf73" points="1180,560 1320,560 1320,850 1180,850"/>
    <polygon class="border" fill="#6fae66" points="1320,560 1600,560 1600,850 1320,850"/>
  </g>
  <use href="#northShape" class="coast"/>

  <!-- SOUTHERN CONTINENT -->
  <g clip-path="url(#southClip)">
    <polygon class="border" fill="#e3c483" points="0,600 1300,600 1300,880 0,880"/>
    <polygon class="border" fill="#8aaa5e" points="0,880 1300,880 1300,1000 0,1000"/>
  </g>
  <use href="#southShape" class="coast"/>
  <path d="M1150,700 C1120,740 1100,780 1060,830" stroke="#4f86ad" stroke-width="4" fill="none"/>

  <!-- island groups that make geographic sense: off continental coasts -->
  <g class="isle" fill="#8fb67f">
    <path d="M30,240 C50,220 80,230 82,260 C84,290 60,305 40,295 C22,285 18,255 30,240 Z"/>
    <ellipse cx="55" cy="330" rx="16" ry="11"/>
  </g>
  <g class="isle" fill="#c9c08a">
    <ellipse cx="560" cy="318" rx="14" ry="9"/><ellipse cx="595" cy="335" rx="11" ry="7"/><ellipse cx="630" cy="312" rx="9" ry="6"/>
  </g>
  <g class="isle" fill="#93b97c">
    <path d="M1555,230 C1575,225 1585,260 1578,300 C1572,340 1560,370 1548,372 C1540,350 1545,300 1546,270 C1547,248 1545,234 1555,230 Z"/>
    <ellipse cx="1570" cy="405" rx="10" ry="7"/>
  </g>
  <g class="isle" fill="#a8cf86">
    <ellipse cx="1480" cy="880" rx="12" ry="8"/><ellipse cx="1525" cy="845" rx="9" ry="6"/>
    <ellipse cx="1445" cy="930" rx="10" ry="7"/><ellipse cx="1540" cy="910" rx="13" ry="8"/>
  </g>

  <!-- NUVATRA, alone in the central sea -->
  <text x="840" y="335" text-anchor="middle" class="sea">CENTRAL SEA</text>
  <path class="isle" fill="#7fbf6e" d="M730,445 C780,410 900,410 950,445 C990,475 985,545 945,575 C900,605 790,605 745,580 C700,555 690,480 730,445 Z"/>
  <polygon points="840,470 865,515 815,515" fill="#8a7a66" stroke="#2c3a40" stroke-width="1.5"/>
  <polygon points="840,470 848,485 832,485" fill="#eef4f7"/>
  <text x="840" y="545" text-anchor="middle" class="n">1 · NUVATRA</text>
  <text x="840" y="561" text-anchor="middle" class="f">crossroads · no single anchor</text>
  <circle cx="840" cy="428" r="6" class="saints"/><text x="852" y="440" class="p">drills</text>
  <circle cx="840" cy="497" r="6" class="saints"/><text x="810" y="501" text-anchor="end" class="p">dragon temple</text>
  <ellipse cx="655" cy="515" rx="20" ry="13" class="isle" fill="#9aa6ad"/>
  <circle cx="655" cy="515" r="6" class="saints"/>
  <text x="655" y="548" text-anchor="middle" class="p" font-weight="700">Saints' forward port</text>
  <g class="isle" fill="#eef4f7"><ellipse cx="805" cy="630" rx="15" ry="9"/><ellipse cx="840" cy="645" rx="12" ry="8"/><ellipse cx="875" cy="632" rx="10" ry="7"/></g>
  <circle cx="840" cy="645" r="5" class="saints"/>
  <text x="840" y="670" text-anchor="middle" class="p">ice islets (south: not natural)</text>
  <ellipse cx="1010" cy="600" rx="30" ry="20" fill="#d9cfa3" fill-opacity="0.55" stroke="#2c3a40" stroke-dasharray="4 3"/>
  <circle cx="1010" cy="600" r="5" class="saints"/>
  <text x="1010" y="635" text-anchor="middle" class="p">turtle island (submerged)</text>

  <!-- labels: northern continent -->
  <text x="800" y="82" text-anchor="middle" class="n">9 · Polar ice</text>
  <text x="800" y="98" text-anchor="middle" class="f">Inuit-like · ice sheet, ice caves</text>

  <text x="270" y="205" text-anchor="middle" class="n">5 · Germanic</text>
  <text x="270" y="222" text-anchor="middle" class="f">forests, gorges, castles</text>
  <text x="270" y="238" text-anchor="middle" class="f">Norse fjords on the north coast</text>
  <circle cx="175" cy="150" r="6" class="poi"/><text x="188" y="154" class="p" font-weight="700">Viking port</text>

  <text x="300" y="400" text-anchor="middle" class="n">3 · Romance</text>
  <text x="300" y="417" text-anchor="middle" class="f">France, Italy, Iberia, Rome</text>
  <text x="300" y="433" text-anchor="middle" class="p">Mediterranean free port</text>

  <text x="75" y="365" text-anchor="middle" class="n" font-size="13">2 · Celtic isles</text>
  <text x="605" y="365" text-anchor="middle" class="n" font-size="13">4 · Hellenic isles</text>
  <text x="605" y="380" text-anchor="middle" class="p">Kallisti volcano</text>

  <text x="800" y="145" text-anchor="middle" class="n">7 · Uralic north</text>
  <text x="800" y="160" text-anchor="middle" class="f">lakes, taiga, tundra · geothermal ice field</text>

  <text x="600" y="235" text-anchor="middle" class="n">6 · Slavic</text>
  <text x="600" y="252" text-anchor="middle" class="f">birch plains, onion domes</text>

  <text x="970" y="225" text-anchor="middle" class="n">8 · The steppe</text>
  <text x="970" y="242" text-anchor="middle" class="f">Turkic and Mongolic · the interior</text>

  <text x="1440" y="190" text-anchor="middle" class="n">15 · Canal empire</text>
  <text x="1440" y="207" text-anchor="middle" class="f">Sinitic · Song China</text>
  <text x="1440" y="223" text-anchor="middle" class="p">clockwork canal city</text>

  <text x="1530" y="440" text-anchor="middle" class="n" font-size="13">16 · Eastern isles</text>
  <text x="1530" y="455" text-anchor="middle" class="p">sky ridge</text>

  <text x="1265" y="390" text-anchor="middle" class="n" font-size="14">12 · Indo-Persian</text>
  <text x="1265" y="406" text-anchor="middle" class="p">Dwarka</text>

  <text x="1255" y="640" text-anchor="middle" class="n" font-size="13">13 · Spice coast</text>
  <text x="1255" y="655" text-anchor="middle" class="f">Dravidian</text>
  <text x="1255" y="670" text-anchor="middle" class="p">pepper port</text>

  <text x="1400" y="660" text-anchor="middle" class="n" font-size="14">14 · Delta land</text>
  <text x="1400" y="676" text-anchor="middle" class="f">Austroasiatic</text>
  <text x="1400" y="691" text-anchor="middle" class="p">solarpunk delta · drowned temple</text>

  <!-- labels: southern continent -->
  <text x="640" y="815" text-anchor="middle" class="n">10 · Desert land</text>
  <text x="640" y="832" text-anchor="middle" class="f">Afroasiatic · Maghreb, Egypt, Mesopotamia</text>
  <circle cx="330" cy="760" r="6" class="poi"/><text x="343" y="764" class="p" font-weight="700">salt-desert kasbah</text>
  <circle cx="1140" cy="715" r="6" class="poi"/><text x="1127" y="745" text-anchor="end" class="p" font-weight="700">Assyrian steampunk city</text>
  <text x="1215" y="725" class="p">land bridge</text>

  <text x="640" y="935" text-anchor="middle" class="n">11 · Coral coast and savanna</text>
  <text x="640" y="952" text-anchor="middle" class="f">Bantu · Swahili coast</text>

  <text x="1490" y="815" text-anchor="middle" class="n" font-size="13">17 · Ocean isles</text>
  <text x="1490" y="830" text-anchor="middle" class="f">Austronesian</text>

  <text x="20" y="620" class="n" font-size="13">← 18 · Far continent</text>
  <text x="20" y="636" class="f">Mesoamerican and Andean,</text>
  <text x="20" y="650" class="f">across the Outer Ocean</text>

  <!-- legend -->
  <g transform="translate(14,860)">
    <rect width="185" height="96" rx="6" fill="#ffffff" opacity="0.85"/>
    <circle cx="16" cy="20" r="6" class="saints"/><text x="30" y="24" class="p">Saints' operation</text>
    <circle cx="16" cy="42" r="6" class="poi"/><text x="30" y="46" class="p">place already imagined</text>
    <text x="10" y="68" class="p">Positions only. Not to scale.</text>
    <text x="10" y="84" class="p">White dashes: borders between lands.</text>
  </g>
</svg>
